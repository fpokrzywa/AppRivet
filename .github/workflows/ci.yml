name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test -count=1 -cover ./...
      - name: Vet
        run: go vet ./...
      - name: Exercise journal ENOSPC on a bounded tmpfs
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/journal-enospc.XXXXXX")
          trap 'if mountpoint -q "$scratch"; then sudo umount "$scratch"; fi; rmdir "$scratch"' EXIT
          sudo mount -t tmpfs -o "size=1m,nodev,nosuid,noexec,uid=$(id -u),gid=$(id -g),mode=0700" tmpfs "$scratch"
          APPRIVET_ENOSPC_TMPFS="$scratch" go test ./internal/admission -run '^TestDiskFullLinuxTmpfs$' -count=1 -v
      - name: Exercise journal quota and sync on a disposable ext4 image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! sudo sh -c 'command -v setquota' >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends quota
          fi
          bash .github/scripts/linux-journal-faults.sh
      - name: Exercise native writeback errors on a disposable ext4 device
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/linux-journal-writeback.sh
      - name: Race detector
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Fuzz device reports
        if: runner.os == 'Linux'
        run: go test ./internal/devices -run='^$' -fuzz=FuzzParse -fuzztime=10000x -parallel=2 -timeout=60s
      - name: Build CLI
        run: go build ./cmd/apprivet
      - name: Fuzz publication intent
        if: runner.os == 'Linux'
        run: go test ./internal/admission -run='^$' -fuzz=FuzzPublicationIntent -fuzztime=10000x -parallel=2 -timeout=60s
      - name: Fuzz append intent
        if: runner.os == 'Linux'
        run: go test ./internal/admission -run='^$' -fuzz=FuzzAppendIntent -fuzztime=10000x -parallel=2 -timeout=60s
      - name: Fuzz source snapshot verification
        if: runner.os == 'Linux'
        run: go test ./internal/snapshot -run='^$' -fuzz=FuzzVerify -fuzztime=10000x -parallel=2 -timeout=60s
      - name: Fuzz admission policy JSON
        if: runner.os == 'Linux'
        run: go test ./internal/admission -run='^$' -fuzz=FuzzAdmissionJSON -fuzztime=10000x -parallel=2 -timeout=60s
      - name: Fuzz reservation journal
        if: runner.os == 'Linux'
        run: go test ./internal/admission -run='^$' -fuzz=FuzzReservationJournal -fuzztime=10000x -parallel=2 -timeout=60s
      - name: Fuzz journal manifests and compressed segments
        if: runner.os == 'Linux'
        run: go test ./internal/admission -run='^$' -fuzz=FuzzJournalStorage -fuzztime=10000x -parallel=2 -timeout=60s
      - name: Source extraction, admission and reservation CLI smoke
        shell: bash
        run: |
          PYTHON=python3
          if [ "$RUNNER_OS" = Windows ]; then PYTHON=python; fi
          "$PYTHON" .github/scripts/worker-smoke.py
      - name: Build and verify the Windows or Linux frontend download
        if: runner.os != 'macOS'
        timeout-minutes: 4
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/frontend"
          DEST="$RUNNER_TEMP/frontend"
          if [ "$RUNNER_OS" = Windows ]; then
            go build -trimpath -ldflags=-H=windowsgui -o "$DEST/AppRivet.exe" ./cmd/apprivet-studio
            python .github/scripts/studio-smoke.py "$DEST/AppRivet.exe"
          else
            go build -trimpath -o "$DEST/AppRivet" ./cmd/apprivet-studio
            python3 .github/scripts/studio-smoke.py "$DEST/AppRivet"
            tar -czf "$DEST/AppRivet-linux.tar.gz" -C "$DEST" AppRivet
          fi
      - name: Upload the portable frontend download
        if: runner.os != 'macOS' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AppRivet-${{ runner.os }}-download
          path: |
            ${{ runner.temp }}/frontend/AppRivet.exe
            ${{ runner.temp }}/frontend/AppRivet-linux.tar.gz
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build CLI and inspect Xcode
        run: |
          go build -o "$RUNNER_TEMP/apprivet" ./cmd/apprivet
          "$RUNNER_TEMP/apprivet" doctor --json
      - name: Read-only device discovery smoke checks
        timeout-minutes: 7
        run: |
          "$RUNNER_TEMP/apprivet" devices --timeout 60s --json
          # A cold hosted CoreSimulator service can exceed the short smoke deadline.
          "$RUNNER_TEMP/apprivet" devices --simulators --timeout 5m --json
      - name: Generate, extract and validate original project
        working-directory: ${{ runner.temp }}
        run: |
          ./apprivet init CIApp --bundle-id org.example.apprivetci
          printf '%s\n' CIApp/App.swift CIApp/ContentView.swift CIApp.xcodeproj/project.pbxproj CIApp.xcodeproj/xcshareddata/xcschemes/CIApp.xcscheme CIAppTests/CIAppTests.swift README.md > source-files.txt
          ./apprivet snapshot create --root CIApp --files-from source-files.txt --output source.tar --json > snapshot.json
          DIGEST=$(python3 -c 'import json; print(json.load(open("snapshot.json"))["data"]["sha256"])')
          ./apprivet snapshot extract --archive source.tar --destination CIExtracted --expect-sha256 "$DIGEST" --json
          plutil -lint CIExtracted/CIApp.xcodeproj/project.pbxproj
          ./apprivet inspect --project CIExtracted --json
          ./apprivet build --project CIExtracted --trust-project --timeout 15m
      - name: Run generated XCTest on an available iOS simulator
        working-directory: ${{ runner.temp }}
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v.get("isAvailable") and "iPhone" in v["name"]))')
          ./apprivet test --project CIExtracted --simulator "$SIMULATOR_ID" --trust-project --timeout 20m
      - name: Validate framework-name collision regression
        working-directory: ${{ runner.temp }}
        run: |
          ./apprivet init SwiftUI --bundle-id org.example.modulecollision
          ./apprivet build --project SwiftUI --trust-project --timeout 10m

  macos-frontend:
    runs-on: macos-15
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Package the macOS frontend
        run: bash scripts/package-macos-app.sh "$RUNNER_TEMP/desktop-package"
      - name: Create, build and launch through the packaged frontend
        timeout-minutes: 23
        run: |
          ditto -x -k "$RUNNER_TEMP/desktop-package/AppRivet-macOS.zip" "$RUNNER_TEMP/desktop-unpacked"
          APP="$RUNNER_TEMP/desktop-unpacked/AppRivet.app"
          codesign --verify --deep --strict "$APP"
          xcrun lipo "$APP/Contents/MacOS/AppRivetDesktop" -verify_arch arm64 x86_64
          xcrun lipo "$APP/Contents/MacOS/apprivet" -verify_arch arm64 x86_64
          mkdir "$RUNNER_TEMP/desktop-smoke"
          "$APP/Contents/MacOS/AppRivetDesktop" --smoke-test "$RUNNER_TEMP/desktop-smoke"
      - name: Upload the macOS app download
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AppRivet-desktop-download
          path: ${{ runner.temp }}/desktop-package/AppRivet-macOS.zip
          if-no-files-found: error
