<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AppRivet</title>
  <link rel="stylesheet" href="/studio.css">
  <script src="/studio.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-content"><span class="wordmark">AppRivet</span><button id="quit" type="button" class="quiet">Quit AppRivet</button></div>
  </header>
  <main>
    <h1>SwiftUI projects</h1>
    <div class="workspace">
      <section class="panel" aria-labelledby="create-heading">
        <h2 id="create-heading">Create an app</h2>
        <form id="create">
          <label for="name">App name</label>
          <input id="name" name="name" value="MyFirstApp" required maxlength="50" pattern="[A-Za-z][A-Za-z0-9]{0,49}" aria-describedby="name-help" spellcheck="false">
          <p class="hint" id="name-help">Start with a letter. Use letters and numbers.</p>
          <label for="bundle">Bundle ID <span class="muted">(optional)</span></label>
          <input id="bundle" name="bundle" placeholder="com.example.myfirstapp" maxlength="255" spellcheck="false">
          <button id="submit" class="primary" type="submit">Create App</button>
        </form>
        <p id="message" role="status" aria-live="polite" class="message"></p>
      </section>
      <section class="panel projects" aria-labelledby="projects-heading">
        <h2 id="projects-heading">Your projects</h2>
        <p class="path" id="workspace-path" aria-label="Workspace path"></p>
        <button id="folder" type="button" class="quiet">Open Projects Folder</button>
        <ul id="projects" aria-label="Generated projects"></ul>
        <p id="empty" class="muted">Your generated apps will appear here.</p>
      </section>
    </div>
    <aside aria-labelledby="simulator-heading" class="simulator-note">
      <h2 id="simulator-heading">Build and run on a Mac</h2>
      <p>Open the project in the AppRivet Mac app. It uses Xcode to build and launch your app in an iOS Simulator.</p>
    </aside>
  </main>
</body>
</html>
